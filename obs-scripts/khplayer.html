<html>
<head>
<title>KH Player Loader</title>
</head>
<body>
<p>Loading...</p>
<script>
async function waitForBackend(url) {
	while(true) {
		console.log("Testing backend...");
		try {
			const response = await fetch(url + "isup");
			if(response.ok) {
				console.log("Backend is readying.");
				window.location = url;
				break;
				}
		} catch(error) {
			console.log("Error:", error);
		}
		await new Promise(resolve => setTimeout(resolve, 100));
	}
}
waitForBackend("http://127.0.0.1:5000/khplayer/");
</script>
</body>
</html>
