{% set title = gettext("Zoom Selector") %}
{% extends "khplayer/base.html" %}

{% block header %}
<h1><a href="../..">&lt; {{title}}</a></h1>
{% endblock %}

{% block main %}
{% if tracker and tracker.gallery %}
<object
    data="gallery.svg"
    type="image/svg+xml"
    style="display: block; width: 100%;">
</object>
{% endif %}
{% endblock %}
